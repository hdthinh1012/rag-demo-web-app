# Nginx configuration for AI Agent RAG Microservice
# Handles form-data uploads to /generate-response endpoint

# Main context - defines global nginx settings
events {  # events block - handles connection processing
    worker_connections 1024;  # max concurrent connections per worker process
}

http {  # http block - contains all HTTP-related directives
    # Basic settings
    include       /etc/nginx/mime.types;  # include external file with MIME type mappings
    default_type  application/octet-stream;  # default MIME type for unknown file extensions
    
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '  # custom log format named "main"
                    '$status $body_bytes_sent "$http_referer" '  # $status = HTTP response code, $body_bytes_sent = response size
                    '"$http_user_agent" "$http_x_forwarded_for" '  # $http_user_agent = browser info, $http_x_forwarded_for = client IP via proxy
                    'rt=$request_time uct="$upstream_connect_time" '  # $request_time = total request time, $upstream_connect_time = time to connect to backend
                    'uht="$upstream_header_time" urt="$upstream_response_time"';  # header time and response time from backend
    
    access_log /var/log/nginx/access.log main;  # access_log directive writes request logs to file using "main" format
    error_log /var/log/nginx/error.log warn;  # error_log directive writes error logs at "warn" level and above
    
    # Performance settings
    sendfile        on;  # sendfile enables efficient file transfer using OS sendfile() syscall
    tcp_nopush      on;  # tcp_nopush sends HTTP headers and file beginning in one packet (with sendfile)
    tcp_nodelay     on;  # tcp_nodelay disables Nagle's algorithm for better latency
    keepalive_timeout 65;  # keepalive_timeout sets how long to keep connection open (65 seconds)
    types_hash_max_size 2048;  # types_hash_max_size sets max size for MIME types hash table
    
    # File upload settings - Match Flask's 16MB limit
    client_max_body_size 20M;  # client_max_body_size sets max allowed request body size (20 megabytes)
    client_body_buffer_size 1M;  # client_body_buffer_size sets buffer size for reading client request body (1 megabyte)
    client_body_timeout 60s;  # client_body_timeout sets timeout for reading client request body (60 seconds)
    client_header_timeout 60s;  # client_header_timeout sets timeout for reading client request headers (60 seconds)
    
    # Proxy buffer settings for large responses
    proxy_buffering on;  # proxy_buffering enables buffering of backend responses
    proxy_buffer_size 4k;  # proxy_buffer_size sets buffer size for first part of backend response (4 kilobytes)
    proxy_buffers 8 4k;  # proxy_buffers sets number and size of buffers for backend response (8 buffers of 4k each)
    proxy_busy_buffers_size 8k;  # proxy_busy_buffers_size sets size of buffers that can be busy sending to client (8 kilobytes)
    
    # Upstream configuration for AI Agent service
    upstream ai_agent_backend {  # upstream block defines group of backend servers for load balancing
        # Define your backend servers here - using container name for Docker network routing
        server ai-agent-ms:5000 max_fails=3 fail_timeout=30s;  # server directive defines backend server: hostname:port max_fails=failed attempts fail_timeout=retry delay
        # Add more servers for load balancing if needed
        # server ai-agent-ms-2:5000 max_fails=3 fail_timeout=30s backup;  # backup server only used when primary fails
        
        # Load balancing method (default is round-robin)
        # least_conn;  # least_conn directive uses least connections load balancing method
        
        # Health checks (if using nginx-plus)
        # health_check interval=10s passes=2 fails=3;  # health_check actively monitors backend health (nginx-plus only)
    }
    
    # Main server block - defines virtual server
    server {  # server block defines virtual server that handles HTTP requests
        listen 80;  # listen directive makes server listen on port 80 (HTTP)
        server_name localhost;  # server_name directive sets server names that this server block responds to
        
        # Security headers - add security-related HTTP headers to all responses
        add_header X-Content-Type-Options nosniff;  # add_header adds HTTP header: prevents MIME type sniffing
        add_header X-Frame-Options DENY;  # add_header adds HTTP header: prevents page from being embedded in frames
        add_header X-XSS-Protection "1; mode=block";  # add_header adds HTTP header: enables XSS filtering with blocking mode
        
        # CORS headers for frontend integration - Cross-Origin Resource Sharing headers
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;  # add_header with 'always' adds header to all responses including errors
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;  # allowed HTTP methods for CORS requests
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;  # allowed headers in CORS requests
        add_header Access-Control-Allow-Credentials "true" always;  # allows cookies/credentials in CORS requests
        
        # Handle preflight OPTIONS requests - browsers send OPTIONS before actual CORS request
        location / {  # location block defines configuration for specific request URIs, "/" matches all requests
            if ($request_method = 'OPTIONS') {  # if directive checks condition: $request_method variable contains HTTP method
                add_header Access-Control-Allow-Origin "http://localhost:3000";  # CORS header for preflight response
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";  # allowed methods in preflight response
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";  # allowed headers in preflight response
                add_header Access-Control-Allow-Credentials "true";  # credentials allowed in preflight response
                add_header Access-Control-Max-Age 86400;  # Access-Control-Max-Age: how long browser can cache preflight response (86400 seconds = 24 hours)
                add_header Content-Length 0;  # Content-Length header: body size is 0 for preflight response
                add_header Content-Type text/plain;  # Content-Type header: response content type
                return 204;  # return directive immediately returns HTTP status 204 (No Content)
            }
            
            # Proxy all requests to backend
            proxy_pass http://ai_agent_backend;  # proxy_pass forwards request to upstream backend defined above
            proxy_set_header Host $host;  # proxy_set_header sets HTTP header: $host variable contains original Host header
            proxy_set_header X-Real-IP $remote_addr;  # proxy_set_header sets HTTP header: $remote_addr variable contains client IP address
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # proxy_set_header sets HTTP header: $proxy_add_x_forwarded_for adds client IP to forwarded chain
            proxy_set_header X-Forwarded-Proto $scheme;  # proxy_set_header sets HTTP header: $scheme variable contains protocol (http/https)
            
            # Timeout settings for proxy connections
            proxy_connect_timeout 30s;  # proxy_connect_timeout: time to establish connection to backend (30 seconds)
            proxy_send_timeout 120s;  # proxy_send_timeout: timeout for sending request to backend (120 seconds)
            proxy_read_timeout 120s;  # proxy_read_timeout: timeout for reading response from backend (120 seconds)
        }
        
        # Specific location for file upload endpoint - exact match for /generate-response
        location = /generate-response {  # location with "=" modifier: exact match only for this specific URI
            # Only allow POST method - security measure to restrict HTTP methods
            if ($request_method !~ ^(POST)$) {  # if directive with regex: !~ means "does not match", ^(POST)$ matches only POST method
                return 405;  # return HTTP 405 Method Not Allowed for non-POST requests
            }
            
            # Proxy to backend
            proxy_pass http://ai_agent_backend/generate-response;  # proxy_pass forwards to specific backend endpoint
            
            # Headers for proper proxying - preserve client information for backend
            proxy_set_header Host $host;  # preserve original Host header from client
            proxy_set_header X-Real-IP $remote_addr;  # send real client IP to backend
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build forwarded IP chain
            proxy_set_header X-Forwarded-Proto $scheme;  # preserve original protocol (http/https)
            
            # Important: Preserve Content-Type for multipart/form-data uploads
            proxy_set_header Content-Type $content_type;  # proxy_set_header preserves original Content-Type: $content_type variable contains client's content type
            proxy_set_header Content-Length $content_length;  # proxy_set_header preserves original Content-Length: $content_length variable contains request body size
            
            # Extended timeouts for file processing - longer timeouts for file upload/processing
            proxy_connect_timeout 30s;  # time to connect to backend (30 seconds)
            proxy_send_timeout 300s;     # timeout for sending large files to backend (5 minutes)
            proxy_read_timeout 300s;     # timeout for AI processing response (5 minutes)
            
            # Disable proxy buffering for file uploads - improves memory usage and performance for large files
            proxy_request_buffering off;  # proxy_request_buffering off: disables buffering of client request body
            proxy_buffering off;  # proxy_buffering off: disables buffering of backend response
            
            # Handle large file uploads - specific settings for this endpoint
            client_max_body_size 20M;  # override global setting: allow up to 20MB uploads for this endpoint
            client_body_timeout 300s;  # client_body_timeout: extended time to read request body (5 minutes)
        }
        
        # Health check endpoint - optimized for quick health monitoring
        location = /health {  # exact match for /health endpoint
            proxy_pass http://ai_agent_backend/health;  # forward to backend health endpoint
            proxy_set_header Host $host;  # preserve Host header
            proxy_set_header X-Real-IP $remote_addr;  # send client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build IP forwarding chain
            
            # Quick timeout for health checks - health checks should be fast
            proxy_connect_timeout 5s;  # short connection timeout (5 seconds)
            proxy_send_timeout 10s;  # short send timeout (10 seconds)
            proxy_read_timeout 10s;  # short read timeout (10 seconds)
        }
        
        # Files listing endpoint - for getting list of uploaded files
        location = /files {  # exact match for /files endpoint
            proxy_pass http://ai_agent_backend/files;  # forward to backend files endpoint
            proxy_set_header Host $host;  # preserve Host header
            proxy_set_header X-Real-IP $remote_addr;  # send client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build IP forwarding chain
            
            # Standard timeouts for file listing
            proxy_connect_timeout 30s;  # connection timeout (30 seconds)
            proxy_send_timeout 60s;  # send timeout (60 seconds)
            proxy_read_timeout 60s;  # read timeout (60 seconds)
        }
        
        # Storage endpoints - handles storage info and rebuild operations
        location ~ ^/storage/(info|rebuild)$ {  # location with regex: "~" enables regex matching, matches /storage/info or /storage/rebuild exactly
            proxy_pass http://ai_agent_backend$request_uri;  # proxy_pass with $request_uri variable: forwards original URI path
            proxy_set_header Host $host;  # preserve Host header
            proxy_set_header X-Real-IP $remote_addr;  # send client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build IP forwarding chain
            
            # Extended timeout for rebuild operations - rebuild can take very long time
            proxy_connect_timeout 30s;  # connection timeout (30 seconds)
            proxy_send_timeout 600s;    # send timeout (10 minutes) for rebuild operations
            proxy_read_timeout 600s;  # read timeout (10 minutes) for rebuild operations
        }
        
        # Debug endpoints (only in development) - regex match for all /debug/ paths
        location ~ ^/debug/ {  # location with regex: matches any path starting with /debug/
            # Uncomment for production to disable debug endpoints
            # return 404;  # return 404 Not Found to disable debug endpoints in production
            
            proxy_pass http://ai_agent_backend$request_uri;  # forward to backend with original URI
            proxy_set_header Host $host;  # preserve Host header
            proxy_set_header X-Real-IP $remote_addr;  # send client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build IP forwarding chain
            
            # Standard timeouts for debug endpoints
            proxy_connect_timeout 30s;  # connection timeout (30 seconds)
            proxy_send_timeout 60s;  # send timeout (60 seconds)
            proxy_read_timeout 60s;  # read timeout (60 seconds)
        }
        
        # Serve static files (if any) - handles static content like CSS, JS, images
        location /static/ {  # location matches all paths starting with /static/
            alias /app/static/;  # alias directive maps URL to filesystem path: /static/ -> /app/static/
            expires 1h;  # expires directive sets cache expiration time (1 hour)
            add_header Cache-Control "public, immutable";  # Cache-Control header: "public" allows caching, "immutable" means content never changes
        }
        
        # Custom error pages - defines custom pages for HTTP errors
        error_page 404 /404.html;  # error_page directive: show /404.html for 404 Not Found errors
        error_page 500 502 503 504 /50x.html;  # error_page directive: show /50x.html for server errors (500, 502, 503, 504)
        
        # Location for custom error page
        location = /50x.html {  # exact match for error page location
            root /usr/share/nginx/html;  # root directive sets document root: looks for files in this directory
        }
    }
    
    # Optional: HTTPS server block - commented out SSL/TLS configuration
    # server {  # additional server block for HTTPS
    #     listen 443 ssl http2;  # listen on port 443 with SSL and HTTP/2 enabled
    #     server_name localhost;  # server name for HTTPS virtual host
    #     
    #     ssl_certificate /path/to/certificate.crt;  # ssl_certificate directive: path to SSL certificate file
    #     ssl_certificate_key /path/to/private.key;  # ssl_certificate_key directive: path to SSL private key file
    #     
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;  # ssl_protocols directive: allowed SSL/TLS protocol versions
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;  # ssl_ciphers directive: allowed encryption ciphers
    #     ssl_prefer_server_ciphers off;  # ssl_prefer_server_ciphers directive: use client's preferred ciphers (modern approach)
    #     
    #     # Include the same location blocks as HTTP server
    #     include /etc/nginx/conf.d/ai-agent-locations.conf;  # include directive: load location blocks from external file
    # }
}  # end of http block