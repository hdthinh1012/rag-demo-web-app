# Nginx configuration for AI Agent RAG Microservice
# Handles form-data uploads to /generate-response endpoint

# Main context - defines global nginx settings
events {  # events block - handles connection processing
    worker_connections 1024;  # max concurrent connections per worker process
}

http {  # http block - contains all HTTP-related directives
    # Basic settings
    include       /etc/nginx/mime.types;  # include external file with MIME type mappings
    default_type  application/octet-stream;  # default MIME type for unknown file extensions
    
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '  # custom log format named "main"
                    '$status $body_bytes_sent "$http_referer" '  # $status = HTTP response code, $body_bytes_sent = response size
                    '"$http_user_agent" "$http_x_forwarded_for" '  # $http_user_agent = browser info, $http_x_forwarded_for = client IP via proxy
                    'rt=$request_time uct="$upstream_connect_time" '  # $request_time = total request time, $upstream_connect_time = time to connect to backend
                    'uht="$upstream_header_time" urt="$upstream_response_time"';  # header time and response time from backend
    
    access_log /var/log/nginx/access.log main;  # access_log directive writes request logs to file using "main" format
    error_log /var/log/nginx/error.log warn;  # error_log directive writes error logs at "warn" level and above
    
    # Performance settings
    sendfile        on;  # sendfile enables efficient file transfer using OS sendfile() syscall
    tcp_nopush      on;  # tcp_nopush sends HTTP headers and file beginning in one packet (with sendfile)
    tcp_nodelay     on;  # tcp_nodelay disables Nagle's algorithm for better latency
    keepalive_timeout 65;  # keepalive_timeout sets how long to keep connection open (65 seconds)
    types_hash_max_size 2048;  # types_hash_max_size sets max size for MIME types hash table
    
    # File upload settings - Match Flask's 16MB limit
    client_max_body_size 20M;  # client_max_body_size sets max allowed request body size (20 megabytes)
    client_body_buffer_size 1M;  # client_body_buffer_size sets buffer size for reading client request body (1 megabyte)
    client_body_timeout 60s;  # client_body_timeout sets timeout for reading client request body (60 seconds)
    client_header_timeout 60s;  # client_header_timeout sets timeout for reading client request headers (60 seconds)
    
    # Proxy buffer settings for large responses
    proxy_buffering on;  # proxy_buffering enables buffering of backend responses
    proxy_buffer_size 4k;  # proxy_buffer_size sets buffer size for first part of backend response (4 kilobytes)
    proxy_buffers 8 4k;  # proxy_buffers sets number and size of buffers for backend response (8 buffers of 4k each)
    proxy_busy_buffers_size 8k;  # proxy_busy_buffers_size sets size of buffers that can be busy sending to client (8 kilobytes)
    
    # Upstream configuration for AI Agent service
    upstream ai_agent_backend {  # upstream block defines group of backend servers for load balancing
        # Define your backend servers here - using container name for Docker network routing
        server ai-agent-ms:5000 max_fails=3 fail_timeout=30s;  # server directive defines backend server: hostname:port max_fails=failed attempts fail_timeout=retry delay
        # Add more servers for load balancing if needed
        # server ai-agent-ms-2:5000 max_fails=3 fail_timeout=30s backup;  # backup server only used when primary fails
        
        # Load balancing method (default is round-robin)
        # least_conn;  # least_conn directive uses least connections load balancing method
        
        # Health checks (if using nginx-plus)
        # health_check interval=10s passes=2 fails=3;  # health_check actively monitors backend health (nginx-plus only)
    }
    
    # Main server block - defines virtual server
    server {  # server block defines virtual server that handles HTTP requests
        listen 80;  # listen directive makes server listen on port 80 (HTTP)
        server_name localhost;  # server_name directive sets server names that this server block responds to
        
        # Include shared location blocks from external file
        include /etc/nginx/conf.d/ai-agent-locations.conf;  # include directive: load location blocks from external file
    }
    
    # Optional: HTTPS server block - commented out SSL/TLS configuration
    server {  # additional server block for HTTPS
        listen 443 ssl;  # listen on port 443 with SSL enabled
        http2 on;  # enable HTTP/2 for this server block
        server_name 14.186.132.221;  # server name for HTTPS virtual host
        
        ssl_certificate /etc/nginx/ssl/14.186.132.221.crt;  # ssl_certificate directive: path to SSL certificate file
        ssl_certificate_key /etc/nginx/ssl/14.186.132.221.key;  # ssl_certificate_key directive: path to SSL private key file
        ssl_password_file /etc/nginx/ssl/14.186.132.221.passphrase.txt;  # ssl_password_file directive: path to SSL passphrase file

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;  # ssl_protocols directive: allowed SSL/TLS protocol versions
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;  # ssl_ciphers directive: allowed encryption ciphers
        ssl_prefer_server_ciphers off;  # ssl_prefer_server_ciphers directive: use client's preferred ciphers (modern approach)
        
        # Include shared location blocks from external file
        include /etc/nginx/conf.d/ai-agent-locations.conf;  # include directive: load location blocks from external file
    }
}  # end of http block