# AI Agent UI Location blocks for Next.js Personal RAG Agent UI
# This file contains all location directives for the Nginx reverse proxy

# Handle preflight OPTIONS requests for CORS
location / {  # location block for all requests
    # Handle CORS preflight requests
    if ($request_method = 'OPTIONS') {  # if request method is OPTIONS
        add_header Access-Control-Allow-Origin "*";  # CORS header for preflight
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";  # allowed methods
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";  # allowed headers
        add_header Access-Control-Max-Age 86400;  # cache preflight response for 24 hours
        add_header Content-Length 0;  # no content in preflight response
        add_header Content-Type text/plain;  # response content type
        return 204;  # return 204 No Content for preflight
    }
    
    # Proxy all requests to Next.js backend
    proxy_pass http://nextjs_backend;  # forward request to upstream backend
    
    # Headers for proper proxying - preserve client information
    proxy_set_header Host $host;  # preserve original Host header
    proxy_set_header X-Real-IP $remote_addr;  # send real client IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # build forwarded IP chain
    proxy_set_header X-Forwarded-Proto $scheme;  # preserve original protocol
    
    # WebSocket support (for Next.js hot reload and real-time features)
    proxy_set_header Upgrade $http_upgrade;  # preserve Upgrade header for WebSockets
    proxy_set_header Connection "upgrade";  # set Connection header for WebSocket upgrade
    
    # Timeout settings for proxy connections
    proxy_connect_timeout 30s;  # time to establish connection to backend
    proxy_send_timeout 60s;  # timeout for sending request to backend
    proxy_read_timeout 60s;  # timeout for reading response from backend
    
    # Disable proxy buffering for real-time responses
    proxy_buffering off;  # disable response buffering for real-time data
}

# Health check endpoint
location /health {  # specific location for health checks
    access_log off;  # don't log health check requests
    return 200 "nginx sidecar healthy\n";  # return simple health response
    add_header Content-Type text/plain;  # set content type for health response
}

# Serve static files efficiently (Next.js static assets)
location /_next/static/ {  # location for Next.js static assets
    proxy_pass http://nextjs_backend;  # forward to Next.js
    proxy_cache_valid 200 1h;  # cache successful responses for 1 hour
    add_header Cache-Control "public, max-age=3600";  # browser cache for 1 hour
}

# Favicon and common static files
location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {  # regex location for static assets
    proxy_pass http://nextjs_backend;  # forward to Next.js
    expires 1h;  # set expiration time for browser cache
    add_header Cache-Control "public, immutable";  # cache control header
}

# Custom error pages
error_page 404 /404.html;  # custom 404 page
error_page 500 502 503 504 /50x.html;  # custom server error page

# Error page location
location = /50x.html {  # exact match for error page
    root /usr/share/nginx/html;  # serve from nginx default html directory
}
