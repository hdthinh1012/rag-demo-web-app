# Nginx sidecar configuration for Next.js Personal RAG Agent UI
# Serves as reverse proxy to Next.js container

# Main context - defines global nginx settings
events {  # events block - handles connection processing
    worker_connections 1024;  # max concurrent connections per worker process
}

http {  # http block - contains all HTTP-related directives
    # Basic settings
    include       /etc/nginx/mime.types;  # include external file with MIME type mappings
    default_type  application/octet-stream;  # default MIME type for unknown file extensions
    
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '  # custom log format
                    '$status $body_bytes_sent "$http_referer" '  # response code and size
                    '"$http_user_agent" "$http_x_forwarded_for" '  # browser and IP info
                    'rt=$request_time uct="$upstream_connect_time" '  # timing metrics
                    'uht="$upstream_header_time" urt="$upstream_response_time"';  # upstream timing
    
    access_log /var/log/nginx/access.log main;  # access log with custom format
    error_log /var/log/nginx/error.log warn;  # error log at warn level and above
    
    # Performance settings
    sendfile        on;  # efficient file transfer using OS sendfile() syscall
    tcp_nopush      on;  # send headers and file beginning in one packet
    tcp_nodelay     on;  # disable Nagle's algorithm for better latency
    keepalive_timeout 65;  # keep connection open for 65 seconds
    types_hash_max_size 2048;  # max size for MIME types hash table
    
    # Client settings
    client_max_body_size 50M;  # allow up to 50MB request body (for file uploads)
    client_body_buffer_size 1M;  # buffer size for reading request body
    client_body_timeout 60s;  # timeout for reading request body
    client_header_timeout 60s;  # timeout for reading request headers
    
    # Proxy buffer settings for responses
    proxy_buffering on;  # enable buffering of backend responses
    proxy_buffer_size 4k;  # buffer size for first part of response
    proxy_buffers 8 4k;  # number and size of buffers for response
    proxy_busy_buffers_size 8k;  # size of buffers that can be busy
    
    # Upstream configuration for Next.js application
    upstream nextjs_backend {  # upstream block defines group of backend servers
        # Define Next.js container - using Docker internal network name
        server personal-rag-agent-ui:3000 max_fails=3 fail_timeout=30s;  # server directive: hostname:port with health check settings
        
        # Load balancing method (default is round-robin)
        # least_conn;  # uncomment to use least connections method
        
        # Health check settings
        # max_fails=3: mark server as failed after 3 consecutive failures
        # fail_timeout=30s: wait 30 seconds before retrying failed server
    }
    
    # Main server block - defines virtual server
    server {  # server block defines virtual server that handles HTTP requests
        listen 80;  # listen on port 80 (HTTP)
        server_name localhost;  # server names this server block responds to
        
        # Security headers for all responses
        add_header X-Content-Type-Options nosniff always;  # prevent MIME type sniffing
        add_header X-Frame-Options DENY always;  # prevent embedding in frames
        add_header X-XSS-Protection "1; mode=block" always;  # enable XSS filtering
        
        # CORS headers for frontend-backend communication
        add_header Access-Control-Allow-Origin "*" always;  # allow all origins (adjust for production)
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;  # allowed HTTP methods
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;  # allowed headers
        
        # Include shared location blocks from external file
        include /etc/nginx/conf.d/ai-agent-ui-locations.conf;  # include directive: load location blocks from external file
    }

    # Optional: HTTPS server block - commented out SSL/TLS configuration
    server {  # additional server block for HTTPS
        listen 444 ssl;  # listen on port 443 with SSL enabled
        http2 on;  # enable HTTP/2 for this server block
        server_name 14.186.132.221;  # server name for HTTPS virtual host
        
        ssl_certificate /etc/nginx/ssl/14.186.132.221.crt;  # ssl_certificate directive: path to SSL certificate file
        ssl_certificate_key /etc/nginx/ssl/14.186.132.221.key;  # ssl_certificate_key directive: path to SSL private key file
        ssl_password_file /etc/nginx/ssl/14.186.132.221.passphrase.txt;  # ssl_password_file directive: path to SSL passphrase file

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;  # ssl_protocols directive: allowed SSL/TLS protocol versions
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;  # ssl_ciphers directive: allowed encryption ciphers
        ssl_prefer_server_ciphers off;  # ssl_prefer_server_ciphers directive: use client's preferred ciphers (modern approach)
        
        # Include shared location blocks from external file
        include /etc/nginx/conf.d/ai-agent-ui-locations.conf;  # include directive: load location blocks from external file
    }
}
